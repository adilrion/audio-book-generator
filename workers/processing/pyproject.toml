[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-worker"
version = "0.1.0"
description = "Local processing worker: PDF extraction/rendering (PyMuPDF), TTS (Kokoro/Piper/say), frame compositing"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.1",
  "soundfile>=0.12",
  "soxr>=0.3",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["audiobook_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
