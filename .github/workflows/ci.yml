name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon runner: the project targets M-series Macs (VideoToolbox, arm64 wheels).
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Hosted VMs may lack the hardware encoder; libx264 keeps video tests deterministic.
      VIDEO_ENCODER: libx264
      LLM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workers/processing/requirements.txt

      - name: System tools (FFmpeg, Tesseract)
        run: brew install ffmpeg tesseract

      - name: Python worker
        run: |
          python -m venv workers/processing/.venv
          workers/processing/.venv/bin/pip install --upgrade pip
          workers/processing/.venv/bin/pip install -r workers/processing/requirements.txt

      - name: Environment
        run: |
          cp .env.example .env
          ln -sf ../../.env apps/api/.env

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm build:packages
          pnpm --filter @app/api build
          pnpm --filter @app/cli build
          pnpm --filter @app/web typecheck
          pnpm --filter @app/web build

      # Unit + integration tests. Tests that need the live API, Postgres or Redis skip themselves;
      # pipeline integration tests use a fake TTS, so no Kokoro model download is needed.
      - name: TypeScript tests
        run: pnpm test:ts

      - name: Python tests
        run: pnpm test:py
